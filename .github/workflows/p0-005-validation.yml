name: P0-005 real Mongo validation

on:
  push:
    branches:
      - opencode/issue-9-33533818879

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      P005_REPLICA_SET_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      P005_STANDALONE_URL: mongodb://127.0.0.1:27018/?directConnection=true
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Start Mongo replica set and standalone
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name p005-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          docker run -d --name p005-standalone -p 27018:27017 mongo:7 --bind_ip_all

          for i in $(seq 1 30); do
            if docker exec p005-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec p005-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec p005-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 2
          done

          for i in $(seq 1 30); do
            if docker exec p005-standalone mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; then break; fi
            sleep 2
          done

          docker exec p005-rs mongosh --quiet --eval 'db.hello()'
          docker exec p005-standalone mongosh --quiet --eval 'db.hello()'

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pytest-xdist motor

      - name: Compile P0-005 files
        run: |
          python -m py_compile backend/routes/jobs.py
          python -m py_compile backend/routes/payments.py
          python -m py_compile backend/tests/test_p0_005_premium_enforcement.py
          python -m py_compile backend/tests/test_p0_005_mongo_integration.py

      - name: Run P0-005 isolated and real Mongo tests
        run: >-
          python -m pytest -q -n 0
          backend/tests/test_p0_005_premium_enforcement.py
          backend/tests/test_p0_005_mongo_integration.py

      - name: Run CPC regression suite against real Mongo
        run: >-
          python -m pytest -q -n 0
          backend/tests/test_cpc_concurrency.py
          backend/tests/test_cpc_stress.py
          backend/tests/test_cpc_mongo_integration.py
