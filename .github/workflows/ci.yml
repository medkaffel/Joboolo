name: ci-core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-hermetic:
    name: Backend hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # `emergentintegrations` is an environment-provided package and is not
        # published on public PyPI. None of the hermetic G0 suites imports it.
        # Keep the application requirements file untouched and exclude only that
        # unavailable package in this isolated public-runner gate.
        run: |
          grep -v '^emergentintegrations==' requirements.txt > /tmp/joboolo-ci-requirements.txt
          python -m pip install -r /tmp/joboolo-ci-requirements.txt
          # The repository's async tests use @pytest.mark.asyncio but the plugin
          # is not declared in the application requirements. Pin it in G0 only;
          # pytest-asyncio 1.4.0 supports pytest 9 and Python 3.11.
          python -m pip install pytest-asyncio==1.4.0

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run hermetic regression suites
        # Several legacy tests deliberately install import stubs in sys.modules.
        # Running every file in one pytest collection lets those stubs leak into
        # unrelated suites. Execute each bounded suite in a fresh pytest process
        # while preserving pytest.ini (including xdist) for every invocation.
        run: |
          suites=(
            tests/test_config.py
            tests/test_cpc_concurrency.py
            tests/test_cpc_stress.py
            tests/test_file_acl.py
            tests/test_p0_008_safe_redirect.py
            tests/test_p0_010_manual_job_geocoding.py
            tests/test_p0_013_partner_credit.py
            tests/test_p0_014_applications_atomic.py
            tests/test_seeding_production.py
            tests/test_ts_a0_contracts.py
            tests/test_ts_a1_candidate_profiles.py
            tests/test_ts_a2_candidate_preferences.py
            tests/test_ts_a3_role_dna.py
            tests/test_ts_a4_opportunity_specs.py
            tests/test_ts_a5_professional_match.py
            tests/test_ts_a6_opportunity_fit.py
            tests/test_ts_a7_organization_verification.py
            tests/test_ts_a8_recruiting_trust.py
            tests/test_ts_a9_authorization_grants.py
            tests/test_ts_a10_privacy_lifecycle.py
          )
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            python -m pytest "${suite}"
            echo "::endgroup::"
          done

  backend-mongo:
    name: Backend Mongo integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # Match G0 without changing application requirements on the public runner.
        run: |
          grep -v '^emergentintegrations==' requirements.txt > /tmp/joboolo-ci-requirements.txt
          python -m pip install -r /tmp/joboolo-ci-requirements.txt
          python -m pip install pytest-asyncio==1.4.0

      - name: Start disposable MongoDB instances
        run: |
          docker run -d --name joboolo-mongo-rs \
            -p 127.0.0.1:27017:27017 \
            mongo:7.0.14 --replSet rs0 --bind_ip_all
          docker run -d --name joboolo-mongo-standalone \
            -p 127.0.0.1:27018:27017 \
            mongo:7.0.14 --bind_ip_all

      - name: Initialize replica set and prove readiness
        run: |
          ready=0
          for _ in {1..60}; do
            if docker exec joboolo-mongo-rs mongosh --quiet \
              --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -qx '1'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Replica-set mongod never became reachable" >&2
            exit 1
          fi

          docker exec joboolo-mongo-rs mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=0
          for _ in {1..60}; do
            if docker exec joboolo-mongo-rs mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx 'true'; then
              primary=1
              break
            fi
            sleep 1
          done
          if [ "$primary" -ne 1 ]; then
            echo "Replica set never reached PRIMARY" >&2
            docker logs joboolo-mongo-rs >&2 || true
            exit 1
          fi

      - name: Prove standalone readiness
        run: |
          ready=0
          for _ in {1..60}; do
            if docker exec joboolo-mongo-standalone mongosh --quiet \
              --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -qx '1'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Standalone MongoDB never became reachable" >&2
            docker logs joboolo-mongo-standalone >&2 || true
            exit 1
          fi

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run disposable Mongo regression suites
        env:
          P005_REPLICA_SET_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
          P005_STANDALONE_URL: mongodb://127.0.0.1:27018/
        run: |
          suites=(
            tests/test_cpc_mongo_integration.py
            tests/test_p0_005_mongo_integration.py
            tests/test_p0_006_mongo_integration.py
          )
          index=0
          for suite in "${suites[@]}"; do
            index=$((index + 1))
            report="/tmp/joboolo-g1-${index}.xml"
            echo "::group::${suite}"
            python -m pytest "${suite}" --junitxml="${report}"
            python - "${report}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in suites)
          if skipped:
              raise SystemExit(f"G1 requires zero skipped tests; observed {skipped}")
          PY
            echo "::endgroup::"
          done

      - name: Cleanup MongoDB containers
        if: always()
        run: docker rm -f joboolo-mongo-rs joboolo-mongo-standalone || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        run: yarn install --non-interactive

      - name: Build frontend
        env:
          CI: "true"
        run: yarn build
