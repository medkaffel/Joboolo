name: OpenAI key check

on:
  issue_comment:
    types: [created]

jobs:
  check:
    if: |
      github.event.comment.user.login == 'medkaffel' &&
      startsWith(github.event.comment.body, '/keycheck')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate OpenAI API key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is missing or empty." > /tmp/result.txt
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.txt
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o /tmp/models.json -w "%{http_code}" \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer ${OPENAI_API_KEY}")

          if [ "$HTTP_CODE" != "200" ]; then
            ERROR_MESSAGE=$(jq -r '.error.message // "Unknown OpenAI API error"' /tmp/models.json 2>/dev/null || true)
            {
              echo "OPENAI_API_KEY check failed."
              echo
              echo "HTTP status: $HTTP_CODE"
              echo "OpenAI response: $ERROR_MESSAGE"
              echo
              echo "The secret value was not printed."
            } > /tmp/result.txt
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.txt
            exit 1
          fi

          TOTAL=$(jq '.data | length' /tmp/models.json)
          MATCHES=$(jq -r '.data[].id' /tmp/models.json | grep -E '^(gpt-5|o[0-9]|codex)' | sort | head -80 || true)

          {
            echo "OPENAI_API_KEY is valid."
            echo
            echo "OpenAI /v1/models returned HTTP 200 with $TOTAL accessible models."
            echo
            echo "Relevant accessible model IDs:"
            echo '```'
            if [ -n "$MATCHES" ]; then
              echo "$MATCHES"
            else
              echo "No GPT-5/Codex-like model IDs found in the returned list."
            fi
            echo '```'
            echo
            echo "The secret value was not printed."
          } > /tmp/result.txt

          cat /tmp/result.txt >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.txt
