          X += [Spacer(1,5*mm)]
          close=Table([[Paragraph("« Avec Joboolo, vous ne payez pas seulement pour publier une offre. Vous construisez un flux de talents que votre équipe peut exploiter aujourd'hui et réactiver demain. C'est la logique de Talent Stream. »",ss['Q'])]],colWidths=[170*mm]); close.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,-1),BRAND),('TOPPADDING',(0,0),(-1,-1),14),('BOTTOMPADDING',(0,0),(-1,-1),14),('LEFTPADDING',(0,0),(-1,-1),14),('RIGHTPADDING',(0,0),(-1,-1),14)]))
          X += [close,Spacer(1,9*mm),box([Paragraph('Les 5 messages à retenir',ss['H2x']),Paragraph("1. <b>L'offre devient un flux de talents.</b>",ss['P']),Paragraph('2. <b>Les CV des candidats ayant postulé constituent le coeur du Stream.</b>',ss['P']),Paragraph("3. <b>Les signaux d'intérêt et le vivier enrichissent la réponse recruteur.</b>",ss['P']),Paragraph('4. <b>Chaque profil doit être explicable et actionnable.</b>',ss['P']),Paragraph('5. <b>Talent Stream vend de la continuité, de la réactivité et du temps recruteur.</b>',ss['P'])],B50,BRAND),Spacer(1,10*mm),Paragraph('Talent Stream by Joboolo',ParagraphStyle('end',parent=ss['T'],fontSize=17,leading=22,textColor=BRAND,alignment=TA_CENTER)),Paragraph('Transformez chaque offre en flux continu de talents.',ParagraphStyle('ends',parent=ss['S'],fontSize=10.5,leading=15,alignment=TA_CENTER))]

          doc.build(X,onFirstPage=footer,onLaterPages=footer)
