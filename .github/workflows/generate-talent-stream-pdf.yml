name: Generate Talent Stream PDF

on:
  push:
    paths:
      - '.github/tmp_generate_talent_stream_pdf.py'
      - '.github/workflows/generate-talent-stream-pdf.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PDF
        run: |
          python -m pip install --quiet reportlab
          python .github/tmp_generate_talent_stream_pdf.py
          test -s Etude-Talent-Stream.pdf
      - name: Commit final PDF and remove temporary generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp_generate_talent_stream_pdf.py .github/workflows/generate-talent-stream-pdf.yml
          git add Etude-Talent-Stream.pdf
          git commit -m "docs: add Talent Stream study PDF"
          git push origin HEAD:main
