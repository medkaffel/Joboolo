name: Generate Talent Stream PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-talent-stream-pdf.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ReportLab
        run: pip install reportlab
      - name: Generate commercial marketing PDF
        shell: bash
        run: |
          python - <<'PY'
          from reportlab.lib.pagesizes import A4
          from reportlab.lib import colors
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak, KeepTogether, Flowable
          from reportlab.lib.units import mm

          OUT='Talent_Stream_Argumentaire_Commercial_Marketing.pdf'
          BRAND=colors.HexColor('#0055FF'); DARK=colors.HexColor('#0044CC'); B50=colors.HexColor('#EBF1FF')
          INK=colors.HexColor('#101828'); MUTED=colors.HexColor('#667085'); SOFT=colors.HexColor('#F8FAFC')
          LINE=colors.HexColor('#DDE3EC'); GREEN=colors.HexColor('#ECFDF3'); ORANGE=colors.HexColor('#FFF4E5'); WHITE=colors.white

          ss=getSampleStyleSheet()
          ss.add(ParagraphStyle(name='B',fontName='Helvetica-Bold',fontSize=10.5,leading=13,textColor=BRAND))
          ss.add(ParagraphStyle(name='T',fontName='Helvetica-Bold',fontSize=28,leading=33,textColor=INK,spaceAfter=7))
          ss.add(ParagraphStyle(name='S',fontName='Helvetica',fontSize=12.5,leading=18,textColor=MUTED,spaceAfter=14))
          ss.add(ParagraphStyle(name='H1x',fontName='Helvetica-Bold',fontSize=18,leading=23,textColor=INK,spaceAfter=8))
          ss.add(ParagraphStyle(name='H2x',fontName='Helvetica-Bold',fontSize=12.4,leading=16,textColor=DARK,spaceAfter=5))
          ss.add(ParagraphStyle(name='P',fontName='Helvetica',fontSize=9.4,leading=14.1,textColor=INK,spaceAfter=6))
          ss.add(ParagraphStyle(name='PB',fontName='Helvetica-Bold',fontSize=9.4,leading=14.1,textColor=INK,spaceAfter=6))
          ss.add(ParagraphStyle(name='Sm',fontName='Helvetica',fontSize=7.7,leading=10.5,textColor=MUTED))
          ss.add(ParagraphStyle(name='Bu',fontName='Helvetica',fontSize=9.1,leading=13.6,textColor=INK,leftIndent=10,firstLineIndent=-6,spaceAfter=4))
          ss.add(ParagraphStyle(name='Ca',fontName='Helvetica-Bold',fontSize=13.1,leading=18,textColor=INK,alignment=TA_CENTER))
          ss.add(ParagraphStyle(name='Q',fontName='Helvetica-Bold',fontSize=16,leading=21.5,textColor=WHITE,alignment=TA_CENTER))
          ss.add(ParagraphStyle(name='TH',fontName='Helvetica-Bold',fontSize=8.5,leading=10.5,textColor=WHITE))
          ss.add(ParagraphStyle(name='TB',fontName='Helvetica',fontSize=8.3,leading=11.7,textColor=INK))
          ss.add(ParagraphStyle(name='TBB',fontName='Helvetica-Bold',fontSize=8.3,leading=11.7,textColor=INK))

          class Tag(Flowable):
              def __init__(self,text,w=62*mm):
                  super().__init__(); self.text=text; self.width=w; self.height=8*mm
              def draw(self):
                  c=self.canv; c.setFillColor(B50); c.roundRect(0,0,self.width,self.height,3*mm,fill=1,stroke=0)
                  c.setFillColor(DARK); c.setFont('Helvetica-Bold',8.2); c.drawCentredString(self.width/2,2.25*mm,self.text)

          def footer(c,doc):
              c.saveState(); c.setStrokeColor(LINE); c.setLineWidth(.5); c.line(17*mm,12*mm,193*mm,12*mm)
              c.setFillColor(MUTED); c.setFont('Helvetica',7.1)
              c.drawString(17*mm,7.5*mm,'Confidentiel - Projet Joboolo - Talent Stream')
              c.drawRightString(193*mm,7.5*mm,f'Page {c.getPageNumber()}'); c.restoreState()

          def box(items,bg=SOFT,border=LINE,pad=8):
              t=Table([[items]],colWidths=[170*mm]); t.setStyle(TableStyle([
                  ('BACKGROUND',(0,0),(-1,-1),bg),('BOX',(0,0),(-1,-1),.7,border),
                  ('LEFTPADDING',(0,0),(-1,-1),pad),('RIGHTPADDING',(0,0),(-1,-1),pad),
                  ('TOPPADDING',(0,0),(-1,-1),pad),('BOTTOMPADDING',(0,0),(-1,-1),pad),('VALIGN',(0,0),(-1,-1),'TOP')]))
              return t

          def tab(rows,widths,header=True,pad=6):
              t=Table(rows,colWidths=widths,repeatRows=1 if header else 0)
              cmds=[('GRID',(0,0),(-1,-1),.4,LINE),('VALIGN',(0,0),(-1,-1),'TOP'),
                    ('LEFTPADDING',(0,0),(-1,-1),pad),('RIGHTPADDING',(0,0),(-1,-1),pad),
                    ('TOPPADDING',(0,0),(-1,-1),pad),('BOTTOMPADDING',(0,0),(-1,-1),pad)]
              if header: cmds.append(('BACKGROUND',(0,0),(-1,0),BRAND))
              t.setStyle(TableStyle(cmds)); return t

          doc=SimpleDocTemplate(OUT,pagesize=A4,rightMargin=17*mm,leftMargin=17*mm,topMargin=15*mm,bottomMargin=18*mm,
              title='Joboolo - Talent Stream - Argumentaire Commercial & Marketing',author='Joboolo')
          X=[]

          X += [Spacer(1,12*mm),Paragraph('JOBOOLO',ss['B']),Spacer(1,8*mm),Paragraph('Talent Stream',ss['T']),
                Paragraph("Transformez chaque offre d'emploi en flux continu de talents.",ss['S']),
                box([Paragraph('Une nouvelle façon de recevoir, prioriser et activer les candidats - sans transformer le recrutement en une nouvelle pile de CV à trier.',ss['Ca'])],B50,BRAND,13),
                Spacer(1,14*mm),box([Paragraph("Talent Stream transforme le recrutement d'une logique de <i>boîte de réception</i> en une logique de <b>pipeline vivant</b> : les CV des candidats qui postulent arrivent dans le Stream de l'offre, puis le recruteur peut exploiter les signaux et profils pertinents autour de cette opportunité.",ss['P'])],SOFT,LINE,12),
                Spacer(1,16*mm),Paragraph('<b>Document commercial & marketing</b>',ss['P']),
                Paragraph('Positionnement, bénéfices, différenciation, pitch de vente, objections, monétisation et messages de campagne.',ss['Sm']),
                Spacer(1,27*mm),Paragraph('CONFIDENTIEL - PROJET JOBOOLO',ParagraphStyle('cf',parent=ss['Sm'],fontName='Helvetica-Bold',textColor=BRAND,alignment=TA_CENTER)),PageBreak()]

          X += [Tag('1. POSITIONNEMENT'),Spacer(1,4*mm),Paragraph('Le recrutement ne devrait pas ressembler à une boîte mail.',ss['H1x']),
                Paragraph("Les recruteurs disposent déjà de CV, d'ATS, de job boards et d'outils de sourcing. Le problème n'est pas seulement d'obtenir davantage de profils. Le problème est de <b>voir rapidement les bons signaux, au bon moment, dans le contexte exact d'une offre</b>.",ss['P']),
                box([Paragraph('La promesse Talent Stream',ss['H2x']),Paragraph("<b>Chaque offre devient un flux de talents exploitable.</b> Les candidatures réellement reçues constituent le socle du Stream. Autour d'elles, Joboolo peut faire remonter des signaux d'intérêt et des profils pertinents pour aider le recruteur à ne plus repartir de zéro.",ss['P'])],B50,BRAND),Spacer(1,6*mm),Paragraph('La rupture de positionnement',ss['H2x'])]
          rows=[[Paragraph('Approche classique',ss['TH']),Paragraph('Talent Stream',ss['TH'])],
                [Paragraph('Une liste de candidatures à ouvrir une par une',ss['TB']),Paragraph('<b>Un flux priorisé</b> centré sur l\'offre',ss['TB'])],
                [Paragraph('Le CV arrive, puis disparaît dans l\'historique',ss['TB']),Paragraph('<b>Le talent reste activable</b> lorsque le contexte redevient pertinent',ss['TB'])],
                [Paragraph('Sourcing et candidatures dans des silos différents',ss['TB']),Paragraph('<b>Une même logique de lecture</b> pour candidats reçus et opportunités à activer',ss['TB'])],
                [Paragraph("Le recruteur cherche l'information",ss['TB']),Paragraph("<b>L'information vient au recruteur</b> avec son contexte",ss['TB'])]]
          X += [tab(rows,[85*mm,85*mm]),Spacer(1,7*mm),box([Paragraph('Positionnement en une phrase',ss['H2x']),Paragraph("Talent Stream est la couche d'activation de Joboolo qui transforme les candidatures et signaux candidats liés à une offre en un pipeline de talents vivant, priorisé et actionnable.",ss['PB'])]),PageBreak()]

          X += [Tag('2. DOULEURS RECRUTEUR'),Spacer(1,4*mm),Paragraph('Pourquoi cette fonctionnalité a une valeur commerciale immédiate',ss['H1x']),Paragraph("Talent Stream répond à quatre frustrations très concrètes du recruteur. L'argumentaire commercial doit partir de ces irritants avant de parler de technologie.",ss['P'])]
          pain=[[Paragraph('1',ss['TBB']),Paragraph("<b>Trop de tri, pas assez de décision</b><br/>Le temps est consommé par l'ouverture des profils, les filtres et la navigation entre outils.",ss['TB'])],
                [Paragraph('2',ss['TBB']),Paragraph("<b>Le vivier est sous-exploité</b><br/>Un candidat non retenu aujourd'hui peut être très pertinent demain, mais il est rarement réactivé au bon moment.",ss['TB'])],
                [Paragraph('3',ss['TBB']),Paragraph("<b>L'intérêt candidat est fragmenté</b><br/>Les postulants, les personnes qui suivent une offre ou une entreprise et les profils à fort matching ne sont pas toujours vus ensemble.",ss['TB'])],
                [Paragraph('4',ss['TBB']),Paragraph("<b>Chaque nouveau recrutement redémarre trop souvent de zéro</b><br/>Le recruteur relance une recherche alors qu'une partie de la réponse existe déjà dans ses interactions passées.",ss['TB'])]]
          p=tab(pain,[12*mm,158*mm],False,7); p.setStyle(TableStyle([('BACKGROUND',(0,0),(0,-1),B50),('TEXTCOLOR',(0,0),(0,-1),DARK),('ALIGN',(0,0),(0,-1),'CENTER')]))
          X += [p,Spacer(1,8*mm),box([Paragraph('Angle de vente',ss['H2x']),Paragraph('Ne pas vendre Talent Stream comme « une nouvelle fonctionnalité de CV ». Le vendre comme <b>un moyen de raccourcir le chemin entre une offre publiée et une conversation utile avec un candidat</b>.',ss['P'])],ORANGE,colors.HexColor('#F2B56B')),Spacer(1,8*mm),Paragraph('Le changement de vocabulaire est stratégique',ss['H2x']),
                Paragraph('• On ne parle plus seulement de <b>candidatures reçues</b> - on parle de <b>talents disponibles autour de l\'offre</b>.',ss['Bu']),Paragraph('• On ne parle plus seulement de <b>base CV</b> - on parle de <b>flux</b>.',ss['Bu']),Paragraph("• On ne parle plus seulement de <b>matching</b> - on parle de <b>priorisation et d'activation</b>.",ss['Bu']),Paragraph('• On ne parle plus seulement de <b>sourcing</b> - on parle de <b>continuité du recrutement</b>.',ss['Bu']),PageBreak()]

          X += [Tag('3. COMMENT CA MARCHE'),Spacer(1,4*mm),Paragraph("Un flux construit autour de l'offre, pas autour d'une base de données",ss['H1x']),Paragraph("L'offre est le point d'ancrage. Chaque profil visible dans Talent Stream doit avoir une raison claire d'être là. Cette transparence est essentielle pour la confiance recruteur.",ss['P'])]
          flow=[[Paragraph('Source du Stream',ss['TH']),Paragraph('Ce que voit le recruteur',ss['TH']),Paragraph('Action naturelle',ss['TH'])],
                [Paragraph('Candidats ayant postulé',ss['TBB']),Paragraph("CV et candidature directement rattachés à l'offre",ss['TB']),Paragraph('Ouvrir, qualifier, contacter, faire avancer',ss['TB'])],
                [Paragraph("Personnes suivant l'offre",ss['TBB']),Paragraph("Signal d'intérêt explicite",ss['TB']),Paragraph('Inviter à candidater lorsque pertinent',ss['TB'])],
                [Paragraph('Anciens candidats redevenus pertinents',ss['TBB']),Paragraph('Historique + nouvelle pertinence',ss['TB']),Paragraph('Réactiver le vivier',ss['TB'])],
                [Paragraph('Profils à fort matching',ss['TBB']),Paragraph("Profils proches de l'offre mais pas encore candidats",ss['TB']),Paragraph('Prioriser puis inviter',ss['TB'])],
                [Paragraph("Personnes suivant l'entreprise",ss['TBB']),Paragraph('Affinité avec la marque employeur',ss['TB']),Paragraph("Convertir l'intérêt en candidature",ss['TB'])]]
          X += [tab(flow,[53*mm,65*mm,52*mm]),Spacer(1,7*mm),box([Paragraph('Règle produit à préserver dans le discours commercial',ss['H2x']),Paragraph("<b>Un Stream doit expliquer pourquoi un profil apparaît.</b> Exemples : « a postulé », « suit cette offre », « ancien candidat compatible », « forte correspondance », « suit votre entreprise ». Le recruteur garde ainsi la maîtrise de son jugement.",ss['P'])],GREEN,colors.HexColor('#75D4A7')),Spacer(1,6*mm),Paragraph("Actions à mettre au centre de l'expérience",ss['H2x']),
                Paragraph("• <b>Voir le CV</b> sans perdre le contexte de l'offre.",ss['Bu']),Paragraph('• <b>Prioriser</b> les meilleurs profils plutôt que parcourir une liste uniforme.',ss['Bu']),Paragraph('• <b>Inviter à candidater</b> un groupe de profils pertinents.',ss['Bu']),Paragraph("• <b>Convertir en candidat actif</b> lorsqu'un talent répond positivement.",ss['Bu']),Paragraph("• <b>Réutiliser le vivier</b> lors d'une nouvelle offre proche.",ss['Bu']),PageBreak()]

          X += [Tag('4. BENEFICES'),Spacer(1,4*mm),Paragraph('Ce que le client achète réellement',ss['H1x']),Paragraph('Le produit est Talent Stream. La valeur achetée est différente : <b>temps gagné, vivier mieux exploité, réactivité et continuité du recrutement</b>.',ss['P'])]
          benefits=[('Moins de friction',"Le recruteur reste dans le contexte de l'offre et accède directement aux profils pertinents."),('Plus de réactivité','Les nouvelles candidatures et opportunités apparaissent dans un même espace de lecture.'),('Un vivier qui prend de la valeur','Les interactions passées cessent d’être un stock dormant et deviennent une réserve activable.'),('Un sourcing plus intelligent','La recherche peut être nourrie par les signaux déjà générés par Joboolo.'),('Une meilleure expérience recruteur','La plateforme fait émerger la prochaine action utile plutôt que d’ajouter une liste à consulter.'),('Une meilleure proposition premium','Talent Stream crée une valeur récurrente qui peut justifier un abonnement supérieur ou une option dédiée.')]
          br=[[Paragraph(str(i),ss['TBB']),Paragraph(f'<b>{a}</b><br/>{b}',ss['TB'])] for i,(a,b) in enumerate(benefits,1)]
          b=tab(br,[12*mm,158*mm],False,7); b.setStyle(TableStyle([('BACKGROUND',(0,0),(0,-1),BRAND),('TEXTCOLOR',(0,0),(0,-1),WHITE),('ALIGN',(0,0),(0,-1),'CENTER')]))
          X += [b,Spacer(1,8*mm),box([Paragraph('Le bénéfice clé à répéter :',ss['H2x']),Paragraph('« Ne laissez plus un bon candidat disparaître entre deux recrutements. »',ss['Ca'])],B50,BRAND,12),PageBreak()]

          X += [Tag('5. DIFFERENCIATION'),Spacer(1,4*mm),Paragraph("Talent Stream n'est ni un ATS classique, ni un moteur de recherche CV",ss['H1x']),Paragraph("La force marketing vient de la combinaison : <b>contexte de l'offre + candidatures + signaux d'intérêt + réactivation du vivier + action immédiate</b>.",ss['P'])]
          d=[[Paragraph('Solution',ss['TH']),Paragraph('Logique dominante',ss['TH']),Paragraph('Limite perçue',ss['TH']),Paragraph('Talent Stream',ss['TH'])],[Paragraph('Boîte de candidatures',ss['TBB']),Paragraph('Recevoir',ss['TB']),Paragraph('Passive et chronologique',ss['TB']),Paragraph('Recevoir + prioriser + activer',ss['TB'])],[Paragraph('ATS',ss['TBB']),Paragraph('Gérer un processus',ss['TB']),Paragraph("Très utile après l'entrée dans le pipeline",ss['TB']),Paragraph('Faire émerger les talents à faire entrer ou réactiver',ss['TB'])],[Paragraph('CVthèque',ss['TBB']),Paragraph('Chercher',ss['TB']),Paragraph('Le recruteur doit relancer la recherche',ss['TB']),Paragraph("Le Stream pousse les opportunités dans le contexte de l'offre",ss['TB'])],[Paragraph('Matching seul',ss['TBB']),Paragraph('Noter',ss['TB']),Paragraph("Un score ne crée pas l'action",ss['TB']),Paragraph('Le matching devient une raison de prioriser ou inviter',ss['TB'])]]
          X += [tab(d,[31*mm,37*mm,49*mm,53*mm],True,5),Spacer(1,8*mm),box([Paragraph('Le « moat » marketing à construire',ss['H2x']),Paragraph("Plus une entreprise publie, reçoit des candidatures et génère des interactions sur Joboolo, plus son environnement Talent Stream peut devenir utile. La proposition de valeur n'est donc pas seulement transactionnelle : elle peut s'enrichir avec l'usage.",ss['P'])]),Spacer(1,7*mm),Paragraph('Formulations de différenciation',ss['H2x']),Paragraph('• « Votre ATS organise les candidats. Talent Stream vous aide à voir lesquels méritent votre attention maintenant. »',ss['Bu']),Paragraph('• « Une CVthèque attend une recherche. Talent Stream vient à vous. »',ss['Bu']),Paragraph('• « Le matching vous donne un score. Talent Stream vous donne une prochaine action. »',ss['Bu']),PageBreak()]

          X += [Tag('6. ARGUMENTAIRE DE VENTE'),Spacer(1,4*mm),Paragraph("Pitch commercial prêt à l'emploi",ss['H1x']),box([Paragraph("« Aujourd'hui, quand vous publiez une offre, vous recevez des candidatures. Avec Talent Stream, l'offre devient un flux vivant : vous voyez les candidats qui ont postulé, mais aussi les signaux et profils qui peuvent être activés autour de ce recrutement. Vous passez moins de temps à rechercher et à reconstituer un vivier, et davantage de temps à décider qui contacter. Talent Stream ne remplace pas votre jugement : il vous apporte la prochaine opportunité pertinente, dans le bon contexte. »",ss['P'])],B50,BRAND),Spacer(1,7*mm),Paragraph('Découverte client - questions à poser',ss['H2x'])]
          for q in ["Combien de temps votre équipe passe-t-elle à retrouver d'anciens candidats pour une nouvelle offre ?","Que deviennent les bons profils non retenus une fois le recrutement terminé ?","Voyez-vous facilement les candidats qui ont déjà manifesté un intérêt pour votre entreprise ou vos offres ?","Quand une offre reçoit peu de candidatures, quelle est votre première action : attendre, rechercher, relancer une base ?","Avez-vous un moyen simple de savoir pourquoi un profil mérite d'être réactivé aujourd'hui ?"]: X.append(Paragraph('• '+q,ss['Bu']))
          X += [Spacer(1,5*mm),Paragraph('Transition vers la démonstration',ss['H2x']),Paragraph("« C'est précisément ce que Talent Stream simplifie : au lieu de vous demander d'aller chercher ces signaux dans plusieurs écrans, nous les remettons autour de l'offre et nous vous proposons l'action suivante. »",ss['PB']),Spacer(1,5*mm),Paragraph('Trois angles selon le persona',ss['H2x'])]
          pe=[[Paragraph('Persona',ss['TH']),Paragraph('Angle commercial',ss['TH'])],[Paragraph('Recruteur opérationnel',ss['TBB']),Paragraph("Moins de navigation, moins de tri, plus de candidats exploitables dans le contexte de l'offre.",ss['TB'])],[Paragraph('Talent Acquisition Manager',ss['TBB']),Paragraph("Réutilisation du vivier, cohérence des pratiques et meilleure activation des signaux d'intérêt.",ss['TB'])],[Paragraph('Direction RH / dirigeant PME',ss['TBB']),Paragraph('Mieux rentabiliser chaque offre et chaque interaction candidat.',ss['TB'])]]
          X += [tab(pe,[48*mm,122*mm]),PageBreak()]

          X += [Tag('7. OBJECTIONS'),Spacer(1,4*mm),Paragraph('Réponses commerciales aux objections probables',ss['H1x'])]
          objections=[("« J'ai déjà un ATS. »","Talent Stream ne cherche pas à remplacer l'ATS. L'ATS structure le processus. Talent Stream intervient en amont et autour de l'offre pour faire émerger les profils à traiter ou réactiver."),("« Je peux déjà chercher dans une CVthèque. »","Oui - mais une CVthèque demande une action de recherche. Talent Stream inverse la logique : les signaux et profils pertinents apparaissent dans le contexte du recrutement en cours."),("« Je ne veux pas être noyé sous davantage de profils. »","C'est précisément l'objectif : ne pas ajouter du volume brut. Le Stream doit être priorisé, explicable et orienté action."),("« Un algorithme ne connaît pas mieux mon besoin que moi. »","Talent Stream ne remplace pas la décision recruteur. Il explique pourquoi un profil apparaît et laisse le recruteur valider, ignorer, inviter ou contacter."),("« Je ne veux pas solliciter des personnes qui n'ont pas candidaté. »","Le Stream distingue clairement les candidatures reçues des profils à inviter. L'action reste volontaire, traçable et adaptée au niveau d'intérêt du candidat.")]
          for o,r in objections: X.append(KeepTogether([Paragraph(o,ss['H2x']),Paragraph(r,ss['P']),Spacer(1,2*mm)]))
          X += [box([Paragraph('Principe de confiance',ss['H2x']),Paragraph('La promesse commerciale doit rester compatible avec une expérience candidat respectueuse : signal explicable, action recruteur maîtrisée, distinction claire entre candidat et prospect, et usage des données conforme au cadre applicable.',ss['P'])],GREEN,colors.HexColor('#75D4A7')),PageBreak()]

          X += [Tag('8. MESSAGES MARKETING'),Spacer(1,4*mm),Paragraph('Territoire de marque et messages de campagne',ss['H1x']),Paragraph('Le mot « Stream » doit évoquer la continuité, le mouvement et l’arrivée naturelle de talents. L’univers de communication doit éviter le vocabulaire froid de « base de données ».',ss['P'])]
          m=[[Paragraph('Usage',ss['TH']),Paragraph('Proposition',ss['TH'])],[Paragraph('Signature principale',ss['TBB']),Paragraph('Talent Stream - Transformez chaque offre en flux continu de talents.',ss['TB'])],[Paragraph('Landing page',ss['TBB']),Paragraph('Les bons candidats ne devraient pas disparaître entre deux recrutements.',ss['TB'])],[Paragraph('Accroche produit',ss['TBB']),Paragraph('Vos candidatures, vos signaux, vos meilleurs talents - dans un seul Stream.',ss['TB'])],[Paragraph('Angle performance',ss['TBB']),Paragraph('Moins de recherche. Plus de conversations utiles.',ss['TB'])],[Paragraph('Angle vivier',ss['TBB']),Paragraph('Votre vivier ne dort plus. Il se réactive quand une opportunité apparaît.',ss['TB'])],[Paragraph('CTA',ss['TBB']),Paragraph('Ouvrir mon Talent Stream / Voir les talents autour de cette offre / Activer les meilleurs profils',ss['TB'])]]
          X += [tab(m,[48*mm,122*mm]),Spacer(1,8*mm)]
          q=Table([[Paragraph('« Une offre ne se ferme plus avec une liste de CV. Elle construit votre prochain vivier. »',ss['Q'])]],colWidths=[170*mm]); q.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,-1),BRAND),('TOPPADDING',(0,0),(-1,-1),14),('BOTTOMPADDING',(0,0),(-1,-1),14),('LEFTPADDING',(0,0),(-1,-1),14),('RIGHTPADDING',(0,0),(-1,-1),14)]))
          X += [q,Spacer(1,8*mm),Paragraph('Ton recommandé',ss['H2x']),Paragraph('• Simple, concret, orienté recruteur.',ss['Bu']),Paragraph("• Peu de jargon IA : parler d'utilité avant de parler d'algorithmes.",ss['Bu']),Paragraph('• Mettre en avant la maîtrise du recruteur : le Stream propose, le recruteur décide.',ss['Bu']),Paragraph('• Illustrer par des actions visibles : voir, prioriser, inviter, convertir, réactiver.',ss['Bu']),PageBreak()]

          X += [Tag('9. MONETISATION & GO-TO-MARKET'),Spacer(1,4*mm),Paragraph("Transformer Talent Stream en moteur d'abonnement",ss['H1x']),Paragraph("Talent Stream se prête à une logique premium car sa valeur augmente avec l'activité du recruteur. Le modèle peut être testé progressivement sans figer trop tôt la tarification.",ss['P'])]
          c=[[Paragraph('Option',ss['TH']),Paragraph('Logique',ss['TH']),Paragraph('Intérêt commercial',ss['TH'])],[Paragraph('Inclus dans une offre Premium',ss['TBB']),Paragraph('Accès au Stream + actions avancées',ss['TB']),Paragraph("Différenciation forte de l'abonnement supérieur",ss['TB'])],[Paragraph('Add-on Talent Stream',ss['TBB']),Paragraph('Option payante ajoutée au forfait recruteur',ss['TB']),Paragraph('Monétisation lisible sans refondre la gamme',ss['TB'])],[Paragraph('Freemium limité',ss['TBB']),Paragraph('Aperçu de quelques profils/signaux puis déblocage',ss['TB']),Paragraph("Démontrer la valeur avant l'achat",ss['TB'])],[Paragraph("Crédits d'activation",ss['TBB']),Paragraph('Certaines invitations/actions consomment des crédits',ss['TB']),Paragraph("Aligner la dépense sur l'usage",ss['TB'])]]
          X += [tab(c,[43*mm,59*mm,68*mm]),Spacer(1,8*mm),Paragraph('Indicateurs à suivre avant de fixer la tarification',ss['H2x']),Paragraph("• Taux d'ouverture du Stream par offre.",ss['Bu']),Paragraph('• Part des candidats contactés depuis le Stream.',ss['Bu']),Paragraph("• Taux d'invitation à candidater et conversion en candidature.",ss['Bu']),Paragraph("• Réactivation d'anciens candidats.",ss['Bu']),Paragraph('• Délai entre publication et premier candidat qualifié/contacté.',ss['Bu']),Paragraph('• Usage récurrent : recruteurs revenant dans Talent Stream chaque semaine.',ss['Bu']),box([Paragraph('Recommandation commerciale',ss['H2x']),Paragraph("Au lancement, vendre d'abord <b>la valeur d'usage</b> et mesurer les comportements. La meilleure tarification sera celle qui capte une partie de la valeur réellement créée sans décourager l'activation régulière du Stream.",ss['P'])],ORANGE,colors.HexColor('#F2B56B')),PageBreak()]

          X += [Tag('10. DEMONSTRATION & CLOSING'),Spacer(1,4*mm),Paragraph('La démonstration idéale en moins de 3 minutes',ss['H1x'])]
