name: opencode-direct

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'medkaffel' &&
      (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODEL: opencode/mimo-v2.5-free

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify free OpenCode model
        shell: bash
        run: |
          opencode models opencode --refresh | tee /tmp/models.txt
          grep -Fx "$MODEL" /tmp/models.txt

      - name: Build issue context
        id: context
        shell: bash
        run: |
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          COMMENT_BODY="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"

          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,comments > /tmp/issue.json

          if printf '%s' "$COMMENT_BODY" | grep -Eiq '^/(oc|opencode)[[:space:]]+build\b|\bBUILD\b'; then
            MODE="build"
          else
            MODE="plan"
          fi

          {
            echo "You are working on GitHub issue #$ISSUE_NUMBER in $GITHUB_REPOSITORY."
            echo
            echo "Read AGENTS.md, ARCHITECTURE.md, BUSINESS_RULES.md, TESTING.md and P0_AUDIT.md when present."
            echo
            echo "GitHub issue context:"
            cat /tmp/issue.json
            echo
            echo "Latest user command:"
            printf '%s\n' "$COMMENT_BODY"
            echo
            if [ "$MODE" = "plan" ]; then
              echo "MODE: PLAN ONLY. Read and analyze the repository. Do not modify files, commit, push, or create a PR. Return a concrete implementation plan and blockers."
            else
              echo "MODE: BUILD. Implement only the requested issue scope, add/update tests, and leave the working tree with the requested changes. Do not push or create a PR yourself; the workflow handles the branch and ChatGPT creates/reviews the PR."
            fi
          } > /tmp/opencode-prompt.txt

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Create build branch
        if: steps.context.outputs.mode == 'build'
        shell: bash
        run: |
          BRANCH="opencode/issue-${{ steps.context.outputs.issue_number }}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run OpenCode plan
        if: steps.context.outputs.mode == 'plan'
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 opencode run \
            --agent plan \
            --model "$MODEL" \
            "$(cat /tmp/opencode-prompt.txt)" | tee /tmp/opencode-output.txt

      - name: Run OpenCode build
        if: steps.context.outputs.mode == 'build'
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 opencode run \
            --agent build \
            --model "$MODEL" \
            "$(cat /tmp/opencode-prompt.txt)" | tee /tmp/opencode-output.txt

      - name: Publish plan response
        if: steps.context.outputs.mode == 'plan'
        shell: bash
        run: |
          gh issue comment "${{ steps.context.outputs.issue_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/opencode-output.txt

      - name: Commit, push and publish branch
        if: steps.context.outputs.mode == 'build'
        shell: bash
        run: |
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            gh issue comment "${{ steps.context.outputs.issue_number }}" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/opencode-output.txt
            exit 0
          fi

          git add -A
          git commit -m "fix: issue #${{ steps.context.outputs.issue_number }} via OpenCode"
          git push --set-upstream origin "$BRANCH"

          {
            cat /tmp/opencode-output.txt
            echo
            echo "Branch ready for ChatGPT PR creation/review: $BRANCH"
          } > /tmp/opencode-build-comment.txt

          gh issue comment "${{ steps.context.outputs.issue_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/opencode-build-comment.txt
