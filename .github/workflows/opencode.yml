name: opencode-direct

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'medkaffel' &&
      (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODEL: opencode/big-pickle

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record checkout SHA
        shell: bash
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify free OpenCode model
        shell: bash
        run: |
          opencode models opencode --refresh | tee /tmp/models.txt
          grep -Fx "$MODEL" /tmp/models.txt

      - name: Build thread context
        id: context
        shell: bash
        run: |
          NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          COMMENT_BODY="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"
          IS_PR="$(jq -r 'if .issue.pull_request then "true" else "false" end' "$GITHUB_EVENT_PATH")"

          if [ "$IS_PR" = "true" ]; then
            gh pr view "$NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,comments,headRefName,baseRefName > /tmp/thread-full.json
          else
            gh issue view "$NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,comments > /tmp/thread-full.json
          fi

          # Keep the context useful but bounded. Full historical agent outputs can
          # become very large; the repository plus the latest comments are the
          # source of truth for a new run.
          jq '{
            number,
            title,
            body: ((.body // "")[0:12000]),
            headRefName,
            baseRefName,
            comments: ((.comments // [])[-4:] | map({
              author: (.author.login // "unknown"),
              body: ((.body // "")[0:8000])
            }))
          }' /tmp/thread-full.json > /tmp/thread.json

          if printf '%s' "$COMMENT_BODY" | grep -Eiq '^/(oc|opencode)[[:space:]]+build\b|\bBUILD\b'; then
            MODE="build"
          else
            MODE="plan"
          fi

          {
            echo "You are working on GitHub $([ "$IS_PR" = "true" ] && echo "pull request" || echo "issue") #$NUMBER in $GITHUB_REPOSITORY."
            echo
            echo "Read AGENTS.md, ARCHITECTURE.md, BUSINESS_RULES.md, TESTING.md and P0_AUDIT.md when present."
            echo
            echo "GitHub thread context (compact; inspect the repository for full source-of-truth details):"
            cat /tmp/thread.json
            echo
            echo "Latest user command:"
            printf '%s\n' "$COMMENT_BODY"
            echo
            echo "At the very end of your response, add exactly one machine-readable line: TESTS=<concise test summary, or NOT_RUN if no tests were executed>."
            echo
            if [ "$MODE" = "plan" ]; then
              echo "MODE: PLAN ONLY. Read and analyze the repository. Do not modify files, commit, push, or create a PR. Return a concrete implementation plan and blockers."
            elif [ "$IS_PR" = "true" ]; then
              echo "MODE: BUILD CORRECTION ON EXISTING PR. The workflow checks out the PR head branch. Apply only the requested corrections, update/add tests, and leave the working tree ready to commit. Do not create another branch or PR and do not push yourself. Stay inside the repository; do not inspect /etc, install system packages, or start external services. If real-service validation is requested, implement the tests/workflow support and let CI/ChatGPT run that validation separately."
            else
              echo "MODE: BUILD. Implement only the requested issue scope, add/update tests, and leave the working tree with the requested changes. Do not push or create a PR yourself; the workflow handles the branch and ChatGPT creates/reviews the PR. Stay inside the repository; do not inspect /etc or install system packages."
            fi
          } > /tmp/opencode-prompt.txt

          echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "is_pr=$IS_PR" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch for correction
        if: steps.context.outputs.mode == 'build' && steps.context.outputs.is_pr == 'true'
        shell: bash
        run: |
          BRANCH="$(jq -r '.headRefName' /tmp/thread.json)"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            echo "Unable to resolve PR head branch" >&2
            exit 1
          fi
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create build branch
        if: steps.context.outputs.mode == 'build' && steps.context.outputs.is_pr != 'true'
        shell: bash
        run: |
          BRANCH="opencode/issue-${{ steps.context.outputs.issue_number }}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run OpenCode plan
        if: steps.context.outputs.mode == 'plan'
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 opencode run \
            --agent plan \
            --model "$MODEL" \
            "Read the attached task context and execute it exactly." \
            --file=/tmp/opencode-prompt.txt | tee /tmp/opencode-output.txt

      - name: Run OpenCode build
        if: steps.context.outputs.mode == 'build'
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 opencode run \
            --agent build \
            --model "$MODEL" \
            "Read the attached task context and execute it exactly." \
            --file=/tmp/opencode-prompt.txt | tee /tmp/opencode-output.txt

      - name: Publish plan response
        if: steps.context.outputs.mode == 'plan'
        shell: bash
        run: |
          gh issue comment "${{ steps.context.outputs.issue_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/opencode-output.txt

      - name: Commit, push and publish branch
        if: steps.context.outputs.mode == 'build'
        shell: bash
        run: |
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            cat /tmp/opencode-output.txt
            if [ "${{ steps.context.outputs.is_pr }}" = "true" ]; then
              echo "No repository changes produced for existing PR ${{ steps.context.outputs.issue_number }}."
            else
              gh issue comment "${{ steps.context.outputs.issue_number }}" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file /tmp/opencode-output.txt
            fi
            exit 0
          fi

          git add -A
          if [ "${{ steps.context.outputs.is_pr }}" = "true" ]; then
            git commit -m "fix: update PR #${{ steps.context.outputs.issue_number }} via OpenCode"
          else
            git commit -m "fix: issue #${{ steps.context.outputs.issue_number }} via OpenCode"
          fi
          git push --set-upstream origin "$BRANCH"

          if [ "${{ steps.context.outputs.is_pr }}" = "true" ]; then
            cat /tmp/opencode-output.txt
            echo
            echo "Existing PR branch updated for ChatGPT review: $BRANCH"
          else
            {
              cat /tmp/opencode-output.txt
              echo
              echo "Branch ready for ChatGPT PR creation/review: $BRANCH"
            } > /tmp/opencode-build-comment.txt

            gh issue comment "${{ steps.context.outputs.issue_number }}" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/opencode-build-comment.txt
          fi

      - name: Publish OpenCode completion receipt
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ISSUE="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
          COMMENT_BODY="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
          IS_PR="$(jq -r 'if .issue.pull_request then "true" else "false" end' "$GITHUB_EVENT_PATH")"

          if printf '%s' "$COMMENT_BODY" | grep -Eiq '^/(oc|opencode)[[:space:]]+build\b|\bBUILD\b'; then
            MODE_VALUE="build"
          else
            MODE_VALUE="plan"
          fi

          STATUS_RAW="${{ job.status }}"
          if [ "$STATUS_RAW" = "success" ]; then
            STATUS_VALUE="SUCCESS"
          else
            STATUS_VALUE="FAIL"
          fi

          if [ -n "${BRANCH:-}" ]; then
            BRANCH_VALUE="$BRANCH"
          elif [ "$MODE_VALUE" = "plan" ]; then
            BRANCH_VALUE="main"
          elif [ "$IS_PR" != "true" ] && [ -n "$ISSUE" ]; then
            BRANCH_VALUE="opencode/issue-${ISSUE}-${GITHUB_RUN_ID}"
          else
            BRANCH_VALUE="UNKNOWN"
          fi

          SHA_VALUE="$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)"

          FILES_CHANGED_VALUE="NONE"
          if [ -n "${START_SHA:-}" ] && git rev-parse --verify "$START_SHA" >/dev/null 2>&1; then
            {
              git diff --name-only "$START_SHA" -- 2>/dev/null || true
              git ls-files --others --exclude-standard 2>/dev/null || true
            } | sort -u > /tmp/opencode-files-changed.txt
            if [ -s /tmp/opencode-files-changed.txt ]; then
              FILES_CHANGED_VALUE="$(paste -sd, /tmp/opencode-files-changed.txt | cut -c1-4000)"
            fi
          fi

          TESTS_VALUE="NOT_REPORTED"
          if [ -f /tmp/opencode-output.txt ]; then
            EXACT_TESTS="$(grep -E '^TESTS=' /tmp/opencode-output.txt | tail -1 | sed 's/^TESTS=//' || true)"
            if [ -n "$EXACT_TESTS" ]; then
              TESTS_VALUE="$EXACT_TESTS"
            else
              HEURISTIC_TESTS="$(grep -Ei '[0-9]+.*(passed|failed|skipped|tests? pass|tests? fail)' /tmp/opencode-output.txt | tail -1 | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-500 || true)"
              if [ -n "$HEURISTIC_TESTS" ]; then
                TESTS_VALUE="$HEURISTIC_TESTS"
              fi
            fi
          fi

          TASK_VALUE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.title' 2>/dev/null | sed -nE 's/.*(P0-[0-9]+).*/\1/p' | head -1 || true)"
          if [ -z "$TASK_VALUE" ]; then
            TASK_VALUE="UNKNOWN"
          fi

          cat > /tmp/opencode-receipt.txt <<EOF
          OPENCODE_DONE
          STATUS=$STATUS_VALUE
          TASK=$TASK_VALUE
          ISSUE=$ISSUE
          BRANCH=$BRANCH_VALUE
          SHA=$SHA_VALUE
          TESTS=$TESTS_VALUE
          FILES_CHANGED=$FILES_CHANGED_VALUE
          MODE=$MODE_VALUE
          RUN_ID=$GITHUB_RUN_ID
          EOF

          gh issue comment "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/opencode-receipt.txt
