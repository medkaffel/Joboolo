name: p0-006-real-mongo-validation

on:
  push:
    branches:
      - opencode/issue-12-p0006-final

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      P005_REPLICA_SET_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      P005_STANDALONE_URL: mongodb://127.0.0.1:27018/?directConnection=true
    steps:
      - uses: actions/checkout@v6

      - name: Start MongoDB replica set and standalone
        run: |
          set -euxo pipefail
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 60); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 1
          done
          docker run -d --name mongo-standalone -p 27018:27017 mongo:7 --bind_ip_all
          for i in $(seq 1 60); do
            if docker exec mongo-standalone mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'db.hello()'
          docker exec mongo-standalone mongosh --quiet --eval 'db.hello()'

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist motor==3.3.1 pymongo==4.5.0 fastapi==0.110.1 pydantic==2.13.4 httpx stripe APScheduler email-validator python-jose passlib bcrypt python-multipart resend

      - name: Run P0-004 P0-005 P0-006 suites
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_cpc_concurrency.py \
            tests/test_cpc_stress.py \
            tests/test_cpc_mongo_integration.py \
            tests/test_p0_005_premium_enforcement.py \
            tests/test_p0_005_mongo_integration.py \
            tests/test_p0_006_lifecycle.py \
            tests/test_p0_006_payments_dates.py \
            tests/test_p0_006_scheduler_query.py \
            tests/test_p0_006_mongo_integration.py \
            -p no:cacheprovider -q

      - name: Compile backend
        run: python -m compileall -q backend
