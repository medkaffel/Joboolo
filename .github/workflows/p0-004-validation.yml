name: P0-004 deep validation

on:
  push:
    branches:
      - opencode/issue-6-33527053985

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pytest-xdist motor

      - name: Compile changed Python files
        run: |
          python -m py_compile backend/routes/jobs.py
          python -m py_compile backend/tests/test_cpc_concurrency.py
          python -m py_compile backend/tests/test_cpc_stress.py
          python -m py_compile backend/tests/test_cpc_mongo_integration.py

      - name: Run isolated, stress, and real-Mongo tests
        run: >-
          python -m pytest -q -n 0
          backend/tests/test_cpc_concurrency.py
          backend/tests/test_cpc_stress.py
          backend/tests/test_cpc_mongo_integration.py
